          </svg>
        </button>
        <button id="chat-send" aria-label="Senden">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const CHAT_URL = "https://trumpp-dev-mcp.trumpp-dev.workers.dev/chat";
      const sessionId = sessionStorage.getItem("chat_session_id") || (() => {
        const id = crypto.randomUUID();
        sessionStorage.setItem("chat_session_id", id);
        return id;
      })();
      let history = [];
      let isLoading = false;
      let mode = null;

      const toggle    = document.getElementById("chat-toggle");
      const chatWin   = document.getElementById("chat-window");
      const closeBtn  = document.getElementById("chat-close");
      const messages  = document.getElementById("chat-messages");
      const input     = document.getElementById("chat-input");
      const sendBtn   = document.getElementById("chat-send");
      const micBtn    = document.getElementById("chat-mic");
      const marketing = document.getElementById("chat-marketing");

      // Voice input — versteckt sich selbst wenn SpeechRecognition nicht verfügbar
      if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
        micBtn.style.display = 'none';
      } else {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new Rec();
        rec.lang = navigator.language || 'de-DE';
        rec.continuous = false;
        rec.interimResults = false;
        let listening = false;
        micBtn.addEventListener('click', () => {
          if (listening) { rec.stop(); return; }
          try { rec.start(); } catch {}
        });
        rec.onstart = () => { listening = true;  micBtn.classList.add('recording'); };
        rec.onend   = () => { listening = false; micBtn.classList.remove('recording'); };
        rec.onresult = e => { input.value = e.results[0][0].transcript; input.focus(); };
        rec.onerror  = () => { listening = false; micBtn.classList.remove('recording'); };
      }

      marketing.addEventListener("click", () => {
        mode = mode === "marketing" ? null : "marketing";
        marketing.setAttribute("aria-pressed", mode === "marketing" ? "true" : "false");
      });

      toggle.addEventListener("click", () => {
        const hidden = chatWin.hasAttribute("hidden");
        if (hidden) { chatWin.removeAttribute("hidden"); input.focus(); }
        else chatWin.setAttribute("hidden", "");
      });
      closeBtn.addEventListener("click", () => chatWin.setAttribute("hidden", ""));
      sendBtn.addEventListener("click", submit);
      input.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
      });

      function appendMsg(role, text) {
        const div = document.createElement("div");
        div.className = "chat-msg " + role;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
      }

      async function submit() {
        const text = input.value.trim().slice(0, 512);
        if (!text || isLoading) return;
        input.value = "";
        isLoading = true;
        sendBtn.disabled = true;
        micBtn.disabled = true;

        history.push({ role: "user", content: text });
        appendMsg("user", text);
        const aiDiv = appendMsg("assistant", "…");
        let aiText = "";

        try {
          const res = await fetch(CHAT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history, sessionId, mode }),
          });
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split("\n");
            buf = lines.pop();
            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              const data = line.slice(6).trim();
              if (data === "[DONE]") break;
              try {
                const token = JSON.parse(data).response;
                if (token) { aiText += token; aiDiv.textContent = aiText; messages.scrollTop = messages.scrollHeight; }
              } catch {}
            }
          }
          history.push({ role: "assistant", content: aiText });
        } catch {
          aiDiv.textContent = "Fehler – bitte nochmal versuchen.";
        } finally {
          isLoading = false;
          sendBtn.disabled = false;
          micBtn.disabled = false;
          input.focus();
        }
      }
    })();
  </script>
