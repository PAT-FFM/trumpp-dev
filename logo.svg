<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 0 331 80" width="331" height="80">
  <defs>
    <style>
      .conn { stroke-dasharray: 5 4; }
      .conn1 { animation: flow 1.8s linear infinite; }
      .conn2 { animation: flow 1.8s linear infinite 0.6s; }
      .conn3 { animation: flow 1.8s linear infinite 1.2s; }
      @keyframes flow {
        from { stroke-dashoffset: 9; }
        to   { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Verbindungen: fließende Dashes = Datenfluss vom Orchestrator -->
  <line class="conn conn1" x1="34" y1="23" x2="19" y2="53"
        stroke="#1a1a1a" stroke-width="1.8" opacity="0.55"/>
  <line class="conn conn2" x1="42" y1="23" x2="57" y2="53"
        stroke="#1a1a1a" stroke-width="1.8" opacity="0.55"/>
  <line class="conn conn3" x1="21" y1="58" x2="55" y2="58"
        stroke="#1a1a1a" stroke-width="1.5" opacity="0.35"/>

  <!-- Alle drei Knoten gleich groß -->
  <circle cx="16" cy="58" r="6.5" fill="#1a1a1a"/>
  <circle cx="60" cy="58" r="6.5" fill="#1a1a1a"/>
  <circle cx="38" cy="16" r="6.5" fill="#1a1a1a"/>

  <!-- Trenner -->
  <line x1="82" y1="10" x2="82" y2="70" stroke="#888" stroke-width="1.5" opacity="0.6"/>

  <!-- Wordmark -->
  <text x="96" y="43" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">
    <tspan fill="#1a1a1a">trumpp</tspan><tspan fill="#555">.dev</tspan>
  </text>
  <text x="97" y="63" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#888" letter-spacing="1.8">Peter Trumpp Consulting</text>
</svg>
