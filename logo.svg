<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 0 331 80" width="331" height="80">

  <!-- Statische Verbindungslinien, sehr subtil -->
  <line x1="35" y1="30" x2="24" y2="51" stroke="#1a1a1a" stroke-width="1"   opacity="0.15"/>
  <line x1="41" y1="30" x2="52" y2="51" stroke="#1a1a1a" stroke-width="1"   opacity="0.15"/>
  <line x1="24" y1="55" x2="52" y2="55" stroke="#1a1a1a" stroke-width="0.8" opacity="0.10"/>

  <!-- Paket: Orchestrator → unten-links (begin=0, reist 0→3.6s, Pause bis 10s) -->
  <circle r="2" fill="#1a1a1a">
    <animateMotion dur="10s" repeatCount="indefinite" begin="0s"
      calcMode="spline" keyPoints="0;1;1" keyTimes="0;0.36;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
      path="M 35 30 L 24 51"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" begin="0s"
      values="0;1;1;0;0" keyTimes="0;0.03;0.33;0.36;1"/>
  </circle>

  <!-- Paket: Orchestrator → unten-rechts (begin=1.2s, reist 0→3.6s innerhalb dur) -->
  <circle r="2" fill="#1a1a1a">
    <animateMotion dur="10s" repeatCount="indefinite" begin="1.2s"
      calcMode="spline" keyPoints="0;1;1" keyTimes="0;0.36;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
      path="M 41 30 L 52 51"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" begin="1.2s"
      values="0;1;1;0;0" keyTimes="0;0.03;0.33;0.36;1"/>
  </circle>

  <!-- Paket: unten-links → unten-rechts (begin=2.4s) -->
  <circle r="1.5" fill="#1a1a1a">
    <animateMotion dur="10s" repeatCount="indefinite" begin="2.4s"
      calcMode="spline" keyPoints="0;1;1" keyTimes="0;0.36;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
      path="M 24 55 L 52 55"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" begin="2.4s"
      values="0;0.65;0.65;0;0" keyTimes="0;0.03;0.33;0.36;1"/>
  </circle>

  <!-- Nodes — pulse wenn Paket ankommt, dur=10s damit Pause stimmt -->
  <!-- Orchestrator: begin=1.8s → feuert bei 1.8, 11.8, … -->
  <circle cx="38" cy="25" r="5" fill="#1a1a1a">
    <animate attributeName="r" dur="10s" repeatCount="indefinite" begin="1.8s"
      values="5;7;5;5" keyTimes="0;0.036;0.1;1"
      calcMode="spline" keySplines="0.25 0 0.25 1;0.25 0 0.25 1;0.4 0 0.2 1"/>
    <animate attributeName="fill" dur="10s" repeatCount="indefinite" begin="1.8s"
      values="#1a1a1a;#666;#1a1a1a;#1a1a1a" keyTimes="0;0.036;0.1;1"
      calcMode="spline" keySplines="0.25 0 0.25 1;0.25 0 0.25 1;0.4 0 0.2 1"/>
  </circle>
  <!-- Unten-links: conn1 kommt an bei t=3.6s → begin=3.6s, feuert bei 3.6, 13.6, … -->
  <circle cx="22" cy="55" r="5" fill="#1a1a1a">
    <animate attributeName="r" dur="10s" repeatCount="indefinite" begin="3.6s"
      values="5;7;5;5" keyTimes="0;0.036;0.1;1"
      calcMode="spline" keySplines="0.25 0 0.25 1;0.25 0 0.25 1;0.4 0 0.2 1"/>
    <animate attributeName="fill" dur="10s" repeatCount="indefinite" begin="3.6s"
      values="#1a1a1a;#666;#1a1a1a;#1a1a1a" keyTimes="0;0.036;0.1;1"
      calcMode="spline" keySplines="0.25 0 0.25 1;0.25 0 0.25 1;0.4 0 0.2 1"/>
  </circle>
  <!-- Unten-rechts: conn2 kommt an bei t=4.8s → begin=4.8s, feuert bei 4.8, 14.8, … -->
  <circle cx="54" cy="55" r="5" fill="#1a1a1a">
    <animate attributeName="r" dur="10s" repeatCount="indefinite" begin="4.8s"
      values="5;7;5;5" keyTimes="0;0.036;0.1;1"
      calcMode="spline" keySplines="0.25 0 0.25 1;0.25 0 0.25 1;0.4 0 0.2 1"/>
    <animate attributeName="fill" dur="10s" repeatCount="indefinite" begin="4.8s"
      values="#1a1a1a;#666;#1a1a1a;#1a1a1a" keyTimes="0;0.036;0.1;1"
      calcMode="spline" keySplines="0.25 0 0.25 1;0.25 0 0.25 1;0.4 0 0.2 1"/>
  </circle>

  <!-- Trenner -->
  <line x1="82" y1="10" x2="82" y2="70" stroke="#888" stroke-width="1.5" opacity="0.6"/>

  <!-- Wordmark -->
  <text x="96" y="43" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">
    <tspan fill="#1a1a1a">trumpp</tspan><tspan fill="#555">.dev</tspan>
  </text>
  <text x="97" y="63" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#888" letter-spacing="1.8">Peter Trumpp Consulting</text>
</svg>
