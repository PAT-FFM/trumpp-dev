<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Standort – trumpp.dev</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
    }

    #map {
      position: fixed;
      inset: 0;
    }

    .panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      background: white;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.15);
      padding: 1rem 1.25rem calc(1rem + env(safe-area-inset-bottom));
      transition: transform 0.3s ease;
    }

    .panel.collapsed {
      transform: translateX(-110%);
    }

    @media (min-width: 640px) {
      .panel {
        left: 1rem;
        right: auto;
        bottom: 1rem;
        width: 25%;
        min-width: 300px;
        max-width: 420px;
        border-radius: 12px;
        padding: 1rem 1.25rem;
      }
    }

    .panel-handle {
      display: none;
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      z-index: 1001;
      background: white;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      font-size: 0.85rem;
      font-weight: 600;
      color: #1976d2;
      cursor: pointer;
    }

    .panel-handle.visible {
      display: inline-block;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .hint {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.35rem;
    }

    button {
      font-size: 1rem;
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #postBtn {
      width: 100%;
      margin-top: 0.75rem;
      background: #1976d2;
      color: white;
      font-weight: 600;
    }

    #postBtn:disabled {
      background: #90a4c0;
      cursor: default;
    }

    .link-btn {
      display: block;
      width: 100%;
      margin-top: 0.4rem;
      background: none;
      color: #1976d2;
      font-size: 0.85rem;
      text-decoration: underline;
      padding: 0.25rem;
    }

    .link-btn:disabled {
      color: #90a4c0;
      cursor: default;
    }

    .my-marker-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #1976d2;
      border: 3px solid white;
      box-shadow: 0 0 0 2px #1976d2;
      cursor: grab;
    }

    .db-marker-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fb8c00;
      border: 3px solid white;
      box-shadow: 0 0 0 2px #fb8c00;
    }

    .focus-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }

    .focus-row[hidden] {
      display: none;
    }

    .focus-row select {
      flex: 1;
      padding: 0.5rem;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .focus-row button {
      background: #eee;
      color: #222;
      white-space: nowrap;
    }

    #status {
      min-height: 1.2em;
      margin-top: 0.6rem;
      font-size: 0.85rem;
    }

    #status.error {
      color: #c62828;
    }

    #status.ok {
      color: #2e7d32;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel">
    <label for="pseudonym">Pseudonym*</label>
    <input type="text" id="pseudonym" placeholder="z.B. Tucan123" maxlength="64" autocomplete="off">
    <p class="hint">Unter diesem Namen wird die Position des blauen Kreises gespeichert. Du kannst den Kreis auf der Karte verschieben.</p>
    <button id="postBtn">Position posten</button>
    <button id="recenterBtn" type="button" class="link-btn">Standort neu ermitteln</button>

    <div class="focus-row" id="focusRow" hidden>
      <select id="focusSelect">
        <option value="">— fokussieren —</option>
      </select>
      <button id="allBtn" type="button">Alle Pins</button>
    </div>

    <div id="status"></div>
  </div>

  <button id="panelHandle" class="panel-handle" type="button">Bedienfeld anzeigen</button>

  <script>
    const map = L.map("map", { zoomControl: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
    map.setView([51.1657, 10.4515], 6);

    let myMarker = null;
    let allDbMarkers = [];
    let latestMarkerByPseudonym = {};

    const myIcon = L.divIcon({
      className: "my-marker-icon",
      html: '<div class="my-marker-dot"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    const dbIcon = L.divIcon({
      className: "db-marker-icon",
      html: '<div class="db-marker-dot"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    const statusEl = document.getElementById("status");
    const postBtn = document.getElementById("postBtn");
    const recenterBtn = document.getElementById("recenterBtn");
    const pseudonymInput = document.getElementById("pseudonym");
    const focusRow = document.getElementById("focusRow");
    const focusSelect = document.getElementById("focusSelect");
    const allBtn = document.getElementById("allBtn");
    const panelEl = document.querySelector(".panel");
    const panelHandle = document.getElementById("panelHandle");

    function showStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "ok";
    }

    function collapsePanel() {
      panelEl.classList.add("collapsed");
      panelHandle.classList.add("visible");
    }

    function expandPanel() {
      panelEl.classList.remove("collapsed");
      panelHandle.classList.remove("visible");
    }

    panelHandle.addEventListener("click", expandPanel);

    function formatTime(isoString) {
      return new Date(isoString).toLocaleTimeString("de-DE", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function getFreshPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation nicht verfügbar"));
          return;
        }
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 10000
        });
      });
    }

    function updateMyMarker(lat, lng) {
      if (myMarker) {
        myMarker.setLatLng([lat, lng]);
      } else {
        myMarker = L.marker([lat, lng], { icon: myIcon, draggable: true }).addTo(map);
        myMarker.bindPopup("Du");
        myMarker.on("dragend", () => {
          showStatus("Position angepasst — wird beim nächsten Posten verwendet.", false);
        });
      }
    }

    function renderDbMarkers(entries) {
      // entries is ordered newest-first (timestamp.desc), can contain
      // multiple rows per pseudonym (history, up to 50 each). Every row
      // gets its own pin; latestMarkerByPseudonym additionally tracks just
      // the newest marker per pseudonym, for the focus dropdown.
      allDbMarkers.forEach((m) => map.removeLayer(m));
      allDbMarkers = [];
      latestMarkerByPseudonym = {};
      entries.forEach((entry) => {
        const marker = L.marker([entry.lat, entry.lng], { icon: dbIcon }).addTo(map);
        marker.bindPopup(
          `<strong>${escapeHtml(entry.pseudonym)}</strong><br>${formatTime(entry.timestamp)}`
        );
        allDbMarkers.push(marker);
        if (!latestMarkerByPseudonym[entry.pseudonym]) {
          latestMarkerByPseudonym[entry.pseudonym] = marker;
        }
      });
    }

    function renderFocusRow(entries) {
      // Dedupe to one dropdown entry per pseudonym — first occurrence wins
      // since entries is ordered newest-first.
      const seen = new Set();
      const uniquePseudonyms = [];
      entries.forEach((e) => {
        if (!seen.has(e.pseudonym)) {
          seen.add(e.pseudonym);
          uniquePseudonyms.push(e.pseudonym);
        }
      });

      if (uniquePseudonyms.length === 0) {
        focusRow.hidden = true;
        return;
      }
      focusRow.hidden = false;
      focusSelect.innerHTML =
        '<option value="">— fokussieren —</option>' +
        uniquePseudonyms
          .map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`)
          .join("");
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadEntries() {
      try {
        const res = await fetch("/location/all");
        if (!res.ok) throw new Error("request failed");
        const entries = await res.json();
        renderDbMarkers(entries);
        renderFocusRow(entries);
      } catch {
        // silently skip — own position still works without DB pins
      }
    }

    focusSelect.addEventListener("change", () => {
      const pseudonym = focusSelect.value;
      if (!pseudonym) return;
      const marker = latestMarkerByPseudonym[pseudonym];
      if (marker) {
        collapsePanel();
        map.setView(marker.getLatLng(), 15);
        marker.openPopup();
      }
    });

    allBtn.addEventListener("click", () => {
      const layers = allDbMarkers.slice();
      if (myMarker) layers.push(myMarker);
      if (layers.length > 0) {
        collapsePanel();
        map.fitBounds(L.featureGroup(layers).getBounds().pad(0.2));
      }
    });

    postBtn.addEventListener("click", async () => {
      const pseudonym = pseudonymInput.value.trim();
      if (!pseudonym) {
        showStatus("Bitte Pseudonym eingeben.", true);
        pseudonymInput.focus();
        return;
      }
      if (!myMarker) {
        showStatus("Position noch nicht ermittelt.", true);
        return;
      }

      postBtn.disabled = true;

      try {
        const { lat, lng } = myMarker.getLatLng();

        const res = await fetch("/location/set", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pseudonym, lat, lng })
        });
        if (!res.ok) throw new Error("request failed");

        map.setView([lat, lng], 15);
        myMarker.openPopup();
        focusSelect.value = "";
        showStatus("Position gepostet.", false);

        await loadEntries();
      } catch (err) {
        showStatus("Position konnte nicht gepostet werden.", true);
      } finally {
        postBtn.disabled = false;
      }
    });

    recenterBtn.addEventListener("click", async () => {
      recenterBtn.disabled = true;
      showStatus("Position wird ermittelt…", false);
      try {
        const pos = await getFreshPosition();
        const { latitude, longitude } = pos.coords;
        updateMyMarker(latitude, longitude);
        map.setView([latitude, longitude], 15);
        showStatus("Standort aktualisiert.", false);
      } catch {
        showStatus("Standort konnte nicht ermittelt werden.", true);
      } finally {
        recenterBtn.disabled = false;
      }
    });

    async function init() {
      const [posResult] = await Promise.allSettled([getFreshPosition(), loadEntries()]);
      if (posResult.status === "fulfilled") {
        const { latitude, longitude } = posResult.value.coords;
        map.setView([latitude, longitude], 15);
        updateMyMarker(latitude, longitude);
      } else {
        showStatus("Standortzugriff nicht möglich – bitte Berechtigung erteilen.", true);
      }
    }

    init();
  </script>
</body>

</html>
