<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Standort – trumpp.dev</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
    }

    #map {
      position: fixed;
      inset: 0;
    }

    .panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      background: white;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.15);
      padding: 1rem 1.25rem calc(1rem + env(safe-area-inset-bottom));
      transition: transform 0.3s ease;
    }

    .panel.collapsed {
      transform: translateX(-110%);
    }

    @media (min-width: 640px) {
      .panel {
        left: 1rem;
        right: auto;
        bottom: 1rem;
        width: 25%;
        min-width: 300px;
        max-width: 420px;
        border-radius: 12px;
        padding: 1rem 1.25rem;
      }
    }

    .panel-handle {
      display: none;
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      z-index: 1001;
      background: white;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      font-size: 0.85rem;
      font-weight: 600;
      color: #1976d2;
      cursor: pointer;
    }

    .panel-handle.visible {
      display: inline-block;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .hint {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.35rem;
    }

    button {
      font-size: 1rem;
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #postBtn {
      width: 100%;
      margin-top: 0.75rem;
      background: #1976d2;
      color: white;
      font-weight: 600;
    }

    #postBtn:disabled {
      background: #90a4c0;
      cursor: default;
    }

    .link-btn {
      display: block;
      width: 100%;
      margin-top: 0.4rem;
      background: none;
      color: #1976d2;
      font-size: 0.85rem;
      text-decoration: underline;
      padding: 0.25rem;
    }

    .link-btn:disabled {
      color: #90a4c0;
      cursor: default;
    }

    .my-marker-icon svg {
      display: block;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
    }

    .db-marker-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid white;
    }

    .date-row {
      margin-bottom: 0.85rem;
    }

    .date-row select {
      width: 100%;
      padding: 0.5rem;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .focus-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }

    .focus-row[hidden] {
      display: none;
    }

    .focus-row select {
      flex: 1;
      padding: 0.5rem;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .focus-row button {
      background: #eee;
      color: #222;
      white-space: nowrap;
    }

    #status {
      min-height: 1.2em;
      margin-top: 0.6rem;
      font-size: 0.85rem;
    }

    #status.error {
      color: #c62828;
    }

    #status.ok {
      color: #2e7d32;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel">
    <div class="date-row">
      <label for="dateSelect">Tag</label>
      <select id="dateSelect"></select>
    </div>
    <p class="hint" id="staleHint" hidden></p>

    <div id="postForm">
      <label for="label">Label*</label>
      <input type="text" id="label" placeholder="z.B. Tucan123" maxlength="64" autocomplete="off">
      <p class="hint">Unter diesem Label wird die Position des blauen Pins gespeichert. Du kannst den Pin auf der Karte verschieben.</p>
      <button id="postBtn">Position posten</button>
      <button id="recenterBtn" type="button" class="link-btn">Standort neu ermitteln</button>
    </div>

    <div class="focus-row" id="focusRow" hidden>
      <select id="focusSelect">
        <option value="">— fokussieren —</option>
      </select>
      <button id="allBtn" type="button">Alle Pins</button>
    </div>

    <button id="hideBtn" type="button" class="link-btn">Bedienfeld verstecken</button>

    <p class="hint" id="queueHint" hidden></p>
    <div id="status"></div>
  </div>

  <button id="panelHandle" class="panel-handle" type="button">Bedienfeld anzeigen</button>

  <script>
    // App-shell cache so the page still opens with no signal at all after
    // the browser/OS kills the background tab — see location-sw.js and
    // CLAUDE.md ("Connectivity resilience"). Scope limited to /location so
    // this never touches the main trumpp.dev site. Registration failure
    // (unsupported browser, non-HTTPS local dev) is silently ignored —
    // the page works the same either way, just without the offline-reload
    // safety net.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/location-sw.js", { scope: "/location" }).catch(() => {});
    }

    const map = L.map("map", { zoomControl: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
    map.setView([51.1657, 10.4515], 6);

    let myMarker = null;
    let allDbMarkers = [];
    let latestMarkerByLabel = {};
    // Full per-label history (all rows for the selected day, not just the
    // newest), newest-first (same order as the loaded entries) — feeds the
    // focus-route polyline below. Kept separate from
    // allDbMarkers/latestMarkerByLabel since those are marker-shaped, not
    // plain entry data.
    let entriesByLabel = {};
    // Same color a label's dots use, keyed by label — so the route line
    // drawn when focusing a label matches its own pins instead of a fixed
    // color. Reused (not recomputed) from renderDbMarkers' color pass.
    let labelColorMap = {};
    // The label currently shown by the focus route line (if any) — null
    // once deselected. Kept separate from focusSelect.value because
    // renderFocusRow() below rebuilds the <select>'s options on every
    // entries reload — the 5s poll (today only) *and* the 20s
    // reconcileConnectivity() interval below (runs regardless of which day
    // is selected) — which resets the browser's own selection; this is
    // what survives that rebuild so either one can restore it.
    let focusedLabel = null;
    // The currently drawn focus-route line, if any — tracked so focusing a
    // different label (or reloading entries) can remove the previous one
    // instead of stacking lines on top of each other.
    let focusPolyline = null;

    // While true, live GPS updates move the "You" marker and pan the map
    // to follow — off once the marker is dragged, or the map itself is
    // panned/zoomed by hand, so a correction/pre-placement or a deliberate
    // look-around isn't immediately overwritten by the next GPS fix.
    // Re-enabled by "Standort neu ermitteln".
    let followMode = true;

    // Every one of our own map.setView/panTo/fitBounds/zoomToShowLayer
    // calls goes through this — dragstart only ever fires from a genuine
    // mouse/touch drag (never programmatically), but zoomstart fires for
    // both a user's manual zoom (wheel/pinch/+-/dblclick) and our own
    // programmatic zoom changes, so those need to be told apart. Wrapping
    // uniformly, even at call sites that already set followMode themselves,
    // means no per-call-site judgment call about whether suppression is
    // "needed" — it's a harmless no-op wherever it isn't.
    let suppressFollowBreak = false;
    function withFollowSuppressed(fn) {
      suppressFollowBreak = true;
      fn();
      suppressFollowBreak = false;
    }
    map.on("dragstart", () => {
      followMode = false;
    });
    map.on("zoomstart", () => {
      if (suppressFollowBreak) return;
      followMode = false;
    });

    // Nearby DB pins collapse into a single neutral cluster icon (plain
    // black circle with a count) so a spot with several stacked pins isn't
    // mistaken for just one. Zooming in spreads them back out into their
    // normal per-label colored markers — the color logic below never
    // touches the cluster icon itself, only the individual markers.
    const dbMarkerCluster = L.markerClusterGroup({
      iconCreateFunction: function (cluster) {
        const count = cluster.getChildCount();
        return L.divIcon({
          html: `<div style="background:#000;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:2px solid white;">${count}</div>`,
          className: "",
          iconSize: [32, 32]
        });
      }
    }).addTo(map);

    // Deliberately a slim pin (point touches the exact spot) rather than a
    // dot like the DB markers below — "You" is a live, draggable position,
    // not a past stored entry, and the shape should say so at a glance.
    const myIcon = L.divIcon({
      className: "my-marker-icon",
      html: `<svg width="17" height="22" viewBox="0 0 26 34" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 0C5.8 0 0 5.8 0 13c0 9.5 13 21 13 21s13-11.5 13-21C26 5.8 20.2 0 13 0z" fill="#1976d2"/>
        <circle cx="13" cy="12.5" r="4.5" fill="#fff"/>
      </svg>`,
      iconSize: [17, 22],
      iconAnchor: [8.5, 22],
      popupAnchor: [0, -19]
    });

    const DB_MARKER_COLORS = [
      "#fb8c00", "#8e24aa", "#2e7d32", "#e53935", "#6d4c41",
      "#00897b", "#d81b60", "#f9a825", "#757575", "#827717"
    ];
    const dbIconCache = {};

    // Colors are assigned by order of first appearance (oldest timestamp
    // per label among the currently loaded entries), rotating through
    // DB_MARKER_COLORS — so the 11th distinct active label reuses the
    // 1st's color. Recomputed on every load, so as older entries age out of
    // the 24h window, "first appearance" (and therefore the color) can
    // shift — acceptable trade-off for a handful of family/friends users.
    function assignColorsByFirstSeen(entries) {
      const firstSeen = {};
      entries.forEach((e) => {
        if (!firstSeen[e.label] || e.timestamp < firstSeen[e.label]) {
          firstSeen[e.label] = e.timestamp;
        }
      });
      const orderedLabels = Object.keys(firstSeen).sort((a, b) =>
        firstSeen[a].localeCompare(firstSeen[b])
      );
      const colorMap = {};
      orderedLabels.forEach((p, i) => {
        colorMap[p] = DB_MARKER_COLORS[i % DB_MARKER_COLORS.length];
      });
      return colorMap;
    }

    function getDbIcon(color) {
      if (!dbIconCache[color]) {
        dbIconCache[color] = L.divIcon({
          className: "db-marker-icon",
          html: `<div class="db-marker-dot" style="background:${color};box-shadow:0 0 0 2px ${color};"></div>`,
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        });
      }
      return dbIconCache[color];
    }

    const statusEl = document.getElementById("status");
    const postForm = document.getElementById("postForm");
    const postBtn = document.getElementById("postBtn");
    const recenterBtn = document.getElementById("recenterBtn");
    const labelInput = document.getElementById("label");
    const focusRow = document.getElementById("focusRow");
    const focusSelect = document.getElementById("focusSelect");
    const allBtn = document.getElementById("allBtn");
    const hideBtn = document.getElementById("hideBtn");
    const panelEl = document.querySelector(".panel");
    const panelHandle = document.getElementById("panelHandle");
    const dateSelect = document.getElementById("dateSelect");
    const staleHint = document.getElementById("staleHint");
    const queueHint = document.getElementById("queueHint");

    // On mobile the control panel is a full-width bottom sheet covering
    // roughly the lower half of the screen (see .panel CSS) — plainly
    // centering "You" on its own latlng puts the marker right behind the
    // panel, invisible. Returns a latlng nudged south by half the panel's
    // actually-rendered height, so that once passed to setView/panTo the
    // marker lands in the middle of the space still visible above the
    // panel instead of dead-center. project()/unproject() do the pixel
    // math at the given zoom, then convert back to a latlng — the standard
    // Leaflet trick for an off-center "setView". No-op (returns latlng
    // unchanged) on desktop, where the panel is a small floating card that
    // doesn't obscure the map center, or while the panel is collapsed.
    function offsetForPanel(latlng, zoom) {
      const isMobileSheet = window.matchMedia("(max-width: 639px)").matches;
      if (!isMobileSheet || panelEl.classList.contains("collapsed")) return latlng;
      const panelHeight = panelEl.getBoundingClientRect().height;
      const point = map.project(latlng, zoom).add([0, panelHeight / 2]);
      return map.unproject(point, zoom);
    }

    // Aborts a fetch after timeoutMs — on flaky mobile signal a request can
    // otherwise hang far longer than a genuine dead zone would need to fail,
    // delaying the point where we treat it as offline (queue the post / show
    // the stale hint).
    function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
    }

    function isNetworkError(err) {
      return err instanceof TypeError || err.name === "AbortError";
    }

    // "Day" always means a Europe/Berlin calendar day, never the viewer's
    // device timezone — this tracker is for a German family/friends group,
    // and someone traveling shouldn't shift what "today" means for everyone
    // watching. All day-boundary math (UTC conversion) happens server-side;
    // here we only ever need the Berlin *date string* for display and for
    // picking which day to request.
    //
    // en-CA formats numeric dates as YYYY-MM-DD (Canada's date convention
    // happens to follow ISO 8601) — a common trick to get Intl to hand back
    // an ISO-shaped string without building it from formatToParts by hand.
    const berlinDateFormat = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Berlin" });

    function todayBerlinDateStr() {
      return berlinDateFormat.format(new Date());
    }

    function formatDateLabel(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("de-DE", {
        day: "2-digit", month: "2-digit", year: "numeric"
      });
    }

    let selectedDate = todayBerlinDateStr();

    function showStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "ok";
    }

    function collapsePanel() {
      panelEl.classList.add("collapsed");
      panelHandle.classList.add("visible");
    }

    function expandPanel() {
      panelEl.classList.remove("collapsed");
      panelHandle.classList.remove("visible");
    }

    panelHandle.addEventListener("click", expandPanel);
    hideBtn.addEventListener("click", collapsePanel);

    function formatTime(isoString) {
      return new Date(isoString).toLocaleTimeString("de-DE", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    // Maps a GeolocationPositionError's numeric code to a status-line message
    // specific enough to act on — "bitte Berechtigung erteilen" only applies
    // to code 1 (PERMISSION_DENIED); showing that same text for code 2/3
    // (no permission problem at all) misleads into chasing a nonexistent
    // permission prompt. This is also the only place a real-device failure
    // is visible without opening devtools, so it needs to carry the actual
    // reason rather than a generic fallback.
    function geolocationErrorMessage(err) {
      switch (err && err.code) {
        case 1: return "Standortzugriff nicht möglich – bitte Berechtigung erteilen.";
        case 2: return "Standort konnte nicht ermittelt werden (Position aktuell nicht verfügbar).";
        case 3: return "Standort konnte nicht ermittelt werden (Zeitüberschreitung).";
        default: return "Standort konnte nicht ermittelt werden.";
      }
    }

    function getFreshPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation nicht verfügbar"));
          return;
        }
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 20000
        });
      });
    }

    // Continuous GPS updates (e.g. while cycling) — separate from
    // getFreshPosition()'s one-shot fetch used for the initial center and
    // "Standort neu ermitteln". Errors (brief signal loss while moving)
    // are expected and silently ignored — the marker just stays at its
    // last known fix until the next good one, no need to interrupt the
    // user with a status message for something transient.
    function startWatchingPosition() {
      if (!navigator.geolocation) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          if (!followMode) return;
          const { latitude, longitude } = pos.coords;
          updateMyMarker(latitude, longitude);
          withFollowSuppressed(() =>
            map.panTo(offsetForPanel([latitude, longitude], map.getZoom()))
          );
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 5000 }
      );
    }

    function updateMyMarker(lat, lng) {
      if (myMarker) {
        myMarker.setLatLng([lat, lng]);
      } else {
        myMarker = L.marker([lat, lng], { icon: myIcon, draggable: true, zIndexOffset: 1000 }).addTo(map);
        myMarker.bindPopup("Du");
        myMarker.on("dragstart", () => {
          followMode = false;
        });
        myMarker.on("dragend", () => {
          showStatus("Position angepasst — wird beim nächsten Posten verwendet.", false);
        });
      }
    }

    function renderDbMarkers(entries) {
      // entries is ordered newest-first (timestamp.desc), can contain
      // multiple rows per label (history, up to 50 each). Every row
      // gets its own pin; latestMarkerByLabel additionally tracks just
      // the newest marker per label, for the focus dropdown.
      dbMarkerCluster.clearLayers();
      allDbMarkers = [];
      latestMarkerByLabel = {};
      entriesByLabel = {};
      labelColorMap = assignColorsByFirstSeen(entries);
      entries.forEach((entry) => {
        const icon = getDbIcon(labelColorMap[entry.label]);
        const marker = L.marker([entry.lat, entry.lng], { icon });
        marker.bindPopup(
          `<strong>${escapeHtml(entry.label)}</strong><br>${formatTime(entry.timestamp)}`
        );
        dbMarkerCluster.addLayer(marker);
        allDbMarkers.push(marker);
        if (!latestMarkerByLabel[entry.label]) {
          latestMarkerByLabel[entry.label] = marker;
        }
        (entriesByLabel[entry.label] = entriesByLabel[entry.label] || []).push(entry);
      });
    }

    function renderFocusRow(entries) {
      // Dedupe to one dropdown entry per label — first occurrence wins
      // since entries is ordered newest-first.
      const seen = new Set();
      const uniqueLabels = [];
      entries.forEach((e) => {
        if (!seen.has(e.label)) {
          seen.add(e.label);
          uniqueLabels.push(e.label);
        }
      });

      if (uniqueLabels.length === 0) {
        focusRow.hidden = true;
        focusedLabel = null;
        return;
      }
      focusRow.hidden = false;
      focusSelect.innerHTML =
        '<option value="">— fokussieren —</option>' +
        uniqueLabels
          .map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`)
          .join("");
      // Rebuilding the <select>'s options resets the browser's own
      // selection to the first ("— fokussieren —") option — restore
      // whichever label was focused, if it still has entries, so the 5s
      // poll doesn't silently un-focus the dropdown out from under the
      // user. updateFocusPolyline() (called by loadEntries right after
      // this) picks focusedLabel back up to redraw the route line too.
      if (focusedLabel && uniqueLabels.includes(focusedLabel)) {
        focusSelect.value = focusedLabel;
      } else {
        focusedLabel = null;
      }
    }

    // (re)draws the focus-route line from whatever entriesByLabel /
    // labelColorMap currently hold for focusedLabel, without touching the
    // map's current pan/zoom — called after every entries reload (day
    // switch, the 5s today-only poll, and the 20s reconcileConnectivity()
    // interval, which runs on any day), so those redraw the line instead of
    // just blanking it (renderDbMarkers wipes all layers including this
    // one). Manual focusing (the focusSelect handler below) additionally
    // fits the view to the freshly drawn line — that's deliberately not
    // done here, same "don't fight the user's current view" rule as follow
    // mode.
    function updateFocusPolyline() {
      if (focusPolyline) {
        map.removeLayer(focusPolyline);
        focusPolyline = null;
      }
      if (!focusedLabel) return;
      const routeEntries = (entriesByLabel[focusedLabel] || []).slice().reverse();
      if (routeEntries.length > 1) {
        focusPolyline = L.polyline(
          routeEntries.map((e) => [e.lat, e.lng]),
          { color: labelColorMap[focusedLabel] || "#1976d2", weight: 3, opacity: 0.8 }
        ).addTo(map);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Tracks the last successful load so the stale hint can say what's
    // actually still on screen ("Stand von HH:MM:SS") rather than just
    // "no connection" — null until the first successful load ever happens.
    let lastSyncAt = null;

    // The day whose entries are actually rendered on the map right now —
    // distinct from selectedDate, which is just what the dropdown asks for.
    // They can diverge when a day switch fails (dead zone): loadEntries()
    // below falls selectedDate back to this so the dropdown never claims to
    // show a day the map doesn't.
    let loadedDate = selectedDate;

    function markSyncOk() {
      lastSyncAt = new Date();
      staleHint.hidden = true;
    }

    function markSyncFailed() {
      staleHint.hidden = false;
      staleHint.textContent = lastSyncAt
        ? `Keine Verbindung – zeige Stand von ${formatTime(lastSyncAt.toISOString())}.`
        : "Keine Verbindung – Positionen konnten noch nicht geladen werden.";
    }

    async function loadEntries() {
      const requestedDate = selectedDate;
      try {
        const res = await fetchWithTimeout(`/location/all?date=${encodeURIComponent(requestedDate)}`);
        if (!res.ok) throw new Error("request failed");
        const entries = await res.json();
        renderDbMarkers(entries);
        renderFocusRow(entries);
        updateFocusPolyline();
        loadedDate = requestedDate;
        markSyncOk();
      } catch {
        // own position still works without DB pins — just flag that what's
        // shown may be outdated instead of silently pretending it's current
        markSyncFailed();
        if (selectedDate !== loadedDate) {
          selectedDate = loadedDate;
          dateSelect.value = loadedDate;
        }
      }
    }

    async function loadAvailableDays() {
      // "Heute" is always offered, even with zero entries — it's the
      // default view. Other days only show up once they actually have pins.
      // The day list itself comes straight from the location_days() RPC
      // (distinct Europe/Berlin calendar days, computed on the DB side).
      const today = todayBerlinDateStr();
      const days = new Set([today]);
      try {
        const res = await fetchWithTimeout("/location/days");
        if (res.ok) {
          const rows = await res.json();
          rows.forEach((r) => days.add(r.day));
        }
      } catch {
        // keep just "Heute" if the request fails
      }
      const sortedDays = Array.from(days).sort().reverse();
      dateSelect.innerHTML = sortedDays
        .map((d) => `<option value="${d}">${d === today ? "Heute" : formatDateLabel(d)}</option>`)
        .join("");
      dateSelect.value = selectedDate;
    }

    // Offline post queue — a position "posted" in a dead zone (POST fails
    // with a network error, not a real server response) is kept here and
    // resent once connectivity returns, instead of just failing outright.
    // localStorage rather than IndexedDB: a handful of small JSON records,
    // no need for the added complexity, and it survives a page reload while
    // still offline.
    const PENDING_KEY = "location_pending_posts";

    function loadPendingPosts() {
      try {
        return JSON.parse(localStorage.getItem(PENDING_KEY)) || [];
      } catch {
        return [];
      }
    }

    function savePendingPosts(list) {
      localStorage.setItem(PENDING_KEY, JSON.stringify(list));
    }

    function updateQueueHint() {
      const count = loadPendingPosts().length;
      if (count === 0) {
        queueHint.hidden = true;
        return;
      }
      queueHint.hidden = false;
      queueHint.textContent = count === 1
        ? "1 Position wartet auf Verbindung und wird automatisch gesendet."
        : `${count} Positionen warten auf Verbindung und werden automatisch gesendet.`;
    }

    // Serializes every read-modify-write on the queue (queuePost and
    // flushQueue below) so they can never interleave — without this, two
    // overlapping flushQueue() runs (e.g. the 'online' event and the 20s
    // timer firing close together, or a slow flush still in flight when
    // the next tick starts) would both read the same pending entry and
    // both send it, producing duplicate DB rows with identical lat/lng and
    // timestamp; or a queuePost() landing mid-flush could get silently
    // overwritten away by the flush's stale save. Plain promise chaining
    // is enough here — JS is single-threaded, the only reason these can
    // interleave at all is the awaits inside flushQueue.
    let queueLock = Promise.resolve();

    function withQueueLock(task) {
      const run = queueLock.then(task, task);
      queueLock = run.then(() => {}, () => {});
      return run;
    }

    function queuePost(entry) {
      return withQueueLock(() => {
        const list = loadPendingPosts();
        list.push(entry);
        savePendingPosts(list);
        updateQueueHint();
      });
    }

    // timestamp is captured client-side at the moment of the click (the
    // actual position-capture time), not the moment the request eventually
    // reaches the server — see location.js, which trusts this timestamp
    // within a bounded window precisely so a delayed dead-zone post keeps
    // showing when it really happened.
    async function sendPosition({ label, lat, lng, timestamp }) {
      const res = await fetchWithTimeout("/location/set", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ label, lat, lng, timestamp })
      });
      if (!res.ok) throw new Error("request failed");
    }

    // Retries queued posts oldest-first, stopping at the first one that
    // still fails — if we're still offline, there's no point burning
    // requests on the rest; they'll be retried on the next tick.
    function flushQueue() {
      return withQueueLock(async () => {
        const list = loadPendingPosts();
        if (list.length === 0) return;

        while (list.length > 0) {
          try {
            await sendPosition(list[0]);
            list.shift();
          } catch {
            break;
          }
        }
        savePendingPosts(list);
        updateQueueHint();
      });
    }

    // Runs on the 'online' event and on a periodic timer — both the queue
    // and the two hints (stale-data, pending-count) should clear themselves
    // the moment connectivity is back, without needing a day switch or the
    // 5s poll (which only runs while viewing today) to happen to notice.
    async function reconcileConnectivity() {
      await flushQueue();
      await loadAvailableDays();
      await loadEntries();
    }

    const POLL_INTERVAL_MS = 5000;
    let pollTimer = null;

    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(loadEntries, POLL_INTERVAL_MS);
    }

    function stopPolling() {
      clearInterval(pollTimer);
      pollTimer = null;
    }

    // Pause polling while the tab is hidden — no point burning Supabase
    // free-tier requests for a map nobody is looking at; catch up
    // immediately on return instead of waiting for the next tick. Also
    // never poll while viewing a past day — that data is static, only
    // "today" can still receive new posts.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopPolling();
      } else {
        loadEntries();
        if (selectedDate === todayBerlinDateStr()) startPolling();
      }
    });

    // Shared by the "Alle Pins" button and enterViewMode() below — fitBounds
    // over every currently loaded DB pin, plus your own position if it's
    // actually shown on the map right now (it isn't while a past day is
    // selected, see enterViewMode).
    function fitAllPins() {
      const layers = allDbMarkers.slice();
      if (myMarker && map.hasLayer(myMarker)) layers.push(myMarker);
      if (layers.length > 0) {
        // Otherwise the next watchPosition update pans right back to your
        // own position a moment later, undoing the framing this just set —
        // same "explicit manual navigation overrides auto-follow" rule as
        // dragging the pin.
        followMode = false;
        collapsePanel();
        withFollowSuppressed(() => map.fitBounds(L.featureGroup(layers).getBounds().pad(0.2)));
      }
    }

    // View mode: a past day is selected. Posting doesn't make sense there —
    // a post is always "now" and would jump straight back to today anyway
    // (see onPositionAccepted) — so the post form and the "You" pin (whose
    // only purpose is preparing/dragging a position to post) are hidden, and
    // the map auto-frames the day's full pin history instead of tracking
    // your own live position.
    function enterViewMode() {
      postForm.hidden = true;
      followMode = false;
      if (myMarker && map.hasLayer(myMarker)) {
        map.removeLayer(myMarker);
      }
      fitAllPins();
    }

    // Live mode: "today" is selected — the normal posting/follow flow. The
    // panel itself is left alone here: reaching this from view mode requires
    // the panel to already be open (that's the only place the day dropdown
    // lives), so there's nothing to expand.
    function enterLiveMode() {
      postForm.hidden = false;
      followMode = true;
      if (myMarker) {
        if (!map.hasLayer(myMarker)) myMarker.addTo(map);
        withFollowSuppressed(() => map.setView(offsetForPanel(myMarker.getLatLng(), 15), 15));
      }
    }

    function applyDateMode() {
      if (selectedDate === todayBerlinDateStr()) {
        enterLiveMode();
      } else {
        enterViewMode();
      }
    }

    dateSelect.addEventListener("change", async () => {
      const requestedDate = dateSelect.value;
      selectedDate = requestedDate;
      focusSelect.value = "";
      focusedLabel = null;
      // loadEntries() may revert selectedDate (and dateSelect.value) back to
      // loadedDate on failure — in that case the switch never actually
      // happened, so applyDateMode() is skipped and everything (view/live
      // mode, panel, pin-mode) stays exactly as it was before this change.
      await loadEntries();
      if (selectedDate === requestedDate) {
        applyDateMode();
      }
      if (selectedDate === todayBerlinDateStr()) {
        startPolling();
      } else {
        stopPolling();
      }
    });

    focusSelect.addEventListener("change", () => {
      const label = focusSelect.value;
      focusedLabel = label || null;
      if (!label) {
        updateFocusPolyline();
        return;
      }
      const marker = latestMarkerByLabel[label];
      if (marker) {
        // Otherwise the next watchPosition update pans right back to your
        // own position a moment later, undoing the framing this just set —
        // same "explicit manual navigation overrides auto-follow" rule as
        // dragging the pin. Resume via "Standort neu ermitteln".
        followMode = false;
        collapsePanel();

        withFollowSuppressed(() => {
          updateFocusPolyline();
          if (focusPolyline) {
            // A label with several pins on this day (e.g. a bike ride
            // posting every 2 min from the Android app, not the web form)
            // reads better as a connected route than as a pile of loose
            // dots — frame the whole line instead of zoomToShowLayer's
            // "just the newest pin" behavior below.
            map.fitBounds(focusPolyline.getBounds().pad(0.2));
            marker.openPopup();
          } else {
            // zoomToShowLayer (statt setView) zoomt genau so weit rein, bis
            // der Marker aus seinem Cluster "herausfällt" — ein festes
            // Zoom-Level würde ihn sonst ggf. weiterhin geclustert lassen.
            dbMarkerCluster.zoomToShowLayer(marker, () => {
              marker.openPopup();
            });
          }
        });
      }
    });

    allBtn.addEventListener("click", fitAllPins);

    postBtn.addEventListener("click", async () => {
      const label = labelInput.value.trim();
      if (!label) {
        showStatus("Bitte Label eingeben.", true);
        labelInput.focus();
        return;
      }
      if (!myMarker) {
        showStatus("Position noch nicht ermittelt.", true);
        return;
      }

      postBtn.disabled = true;
      const { lat, lng } = myMarker.getLatLng();
      const entry = { label, lat, lng, timestamp: new Date().toISOString() };

      try {
        await sendPosition(entry);
        await onPositionAccepted(lat, lng);
      } catch (err) {
        if (isNetworkError(err)) {
          // No connection right now (dead zone) — keep the position locally
          // and send it automatically once we're back online, instead of
          // just reporting failure and losing the click. The pending-count
          // hint (updateQueueHint) is the single place that communicates
          // "still waiting for a connection" — #status just confirms the
          // click was accepted, same as the immediate-success case, so the
          // two don't end up saying overlapping things.
          await queuePost(entry);
          await onPositionAccepted(lat, lng);
        } else {
          showStatus("Position konnte nicht gepostet werden.", true);
        }
      } finally {
        postBtn.disabled = false;
      }
    });

    async function onPositionAccepted(lat, lng) {
      withFollowSuppressed(() => map.setView(offsetForPanel([lat, lng], 15), 15));
      myMarker.openPopup();
      focusSelect.value = "";
      focusedLabel = null;
      showStatus("Position gepostet.", false);

      // A post always happens "now" — jump the view to today so the
      // just-posted pin is actually visible, even if the user had a past
      // day selected. If today's data can't actually be loaded right now
      // (dead zone), loadEntries() falls selectedDate back to whatever day
      // is genuinely on screen — polling is decided after that, not before.
      selectedDate = todayBerlinDateStr();
      await loadAvailableDays();
      await loadEntries();
      if (selectedDate === todayBerlinDateStr()) {
        startPolling();
      } else {
        stopPolling();
      }
    }

    recenterBtn.addEventListener("click", async () => {
      recenterBtn.disabled = true;
      showStatus("Position wird ermittelt…", false);
      try {
        const pos = await getFreshPosition();
        const { latitude, longitude } = pos.coords;
        followMode = true;
        updateMyMarker(latitude, longitude);
        withFollowSuppressed(() => map.setView(offsetForPanel([latitude, longitude], 15), 15));
        showStatus("Standort aktualisiert.", false);
      } catch (err) {
        showStatus(geolocationErrorMessage(err), true);
      } finally {
        recenterBtn.disabled = false;
      }
    });

    // Retry on both signals: the 'online' event fires promptly but only
    // reflects the network interface, not actual reachability (e.g. Wi-Fi
    // connected, no real internet) — the interval timer is the fallback
    // that eventually catches those cases too.
    const QUEUE_RETRY_MS = 20000;
    window.addEventListener("online", reconcileConnectivity);
    setInterval(reconcileConnectivity, QUEUE_RETRY_MS);

    async function init() {
      updateQueueHint();
      await loadAvailableDays();
      const [posResult] = await Promise.allSettled([getFreshPosition(), loadEntries()]);
      if (posResult.status === "fulfilled") {
        const { latitude, longitude } = posResult.value.coords;
        withFollowSuppressed(() => map.setView(offsetForPanel([latitude, longitude], 15), 15));
        updateMyMarker(latitude, longitude);
      } else {
        showStatus(geolocationErrorMessage(posResult.reason), true);
      }
      startPolling();
      startWatchingPosition();
      flushQueue();
    }

    init();
  </script>
</body>

</html>
